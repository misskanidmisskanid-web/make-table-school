<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจัดตารางเรียน-ตารางสอน วิทยาลัยเทคนิคปทุมธานี</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@500;600;700&display=swap');

:root{
  --navy:#0f2b52;
  --navy2:#163a6b;
  --navy3:#1e4a86;
  --gold:#c9a154;
  --paper:#f6f4ee;
  --card:#ffffff;
  --ink:#1c2430;
  --sub:#5b6577;
  --line:#e2e1d8;
  --line2:#d9d7ca;
  --green:#1f8a4c;
  --red:#c0392b;
  --grey-lock:#e7e5df;
  --radius:10px;
  --shadow:0 1px 2px rgba(15,43,82,.06),0 4px 14px rgba(15,43,82,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Sarabun',sans-serif;
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
}
h1,h2,h3,.disp{font-family:'Prompt',sans-serif;}
button{font-family:inherit;cursor:pointer;}
select,input{font-family:inherit;}
::selection{background:var(--gold);color:#fff;}

/* ---- topbar ---- */
.topbar{
  background:linear-gradient(135deg,var(--navy),var(--navy3));
  color:#fff;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  position:sticky;top:0;z-index:40;
  box-shadow:0 2px 10px rgba(15,43,82,.18);
}
.topbar .brand{display:flex;align-items:center;gap:12px;}
.topbar .brand .mark{
  width:38px;height:38px;border-radius:50%;
  background:var(--gold);
  display:flex;align-items:center;justify-content:center;
  color:var(--navy);font-family:'Prompt';font-weight:700;font-size:15px;
  flex:none;
}
.topbar .brand .t1{font-family:'Prompt';font-weight:600;font-size:16px;}
.topbar .brand .t2{font-size:12.5px;color:#cfe0f5;}
.topbar .meta{display:flex;align-items:center;gap:10px;font-size:13px;}
.pill{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
  padding:5px 12px;border-radius:100px;font-size:12.5px;
}
.tb-btn{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.3);
  color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;
  transition:.15s;
}
.tb-btn:hover{background:rgba(255,255,255,.22);}
.topbar-main{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.quick-nav{width:100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;padding-top:4px;border-top:1px solid rgba(255,255,255,.18);}
.quick-nav-btn{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:7px 8px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:.15s;}
.quick-nav-btn:hover{background:rgba(255,255,255,.20);}
.quick-nav-btn.active{background:var(--gold);border-color:var(--gold);color:var(--navy);box-shadow:0 2px 7px rgba(0,0,0,.12);}
@media(max-width:900px){.quick-nav{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media(max-width:520px){.quick-nav{grid-template-columns:repeat(2,minmax(0,1fr));}.quick-nav-btn{font-size:12px;padding:7px 5px;}}
.auto-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start;}
.auto-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
.auto-card h3{margin:0 0 8px;color:var(--navy);font-size:15px;}
.auto-card .muted{font-size:12px;color:var(--sub);}
.auto-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.auto-form .field{margin:0;}
.auto-form select,.auto-form input{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line2);background:#fff;}
.auto-btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;}
.auto-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.auto-stat{background:#faf9f5;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;}
.auto-stat b{display:block;font-family:'Prompt';font-size:19px;color:var(--navy);}
.auto-stat span{font-size:11px;color:var(--sub);}
.auto-lock-table{width:100%;border-collapse:collapse;font-size:12px;}
.auto-lock-table th,.auto-lock-table td{padding:7px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left;}
.auto-lock-table th{background:#f5f3ed;color:var(--navy);}
.auto-lock-pill{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;background:#eef3fb;color:var(--navy);font-size:11px;}
.auto-result{padding:11px 12px;border-radius:9px;background:#f7fbf8;border:1px solid #cfe8d7;color:#245c39;font-size:12.5px;margin-top:10px;}
.auto-warning{padding:11px 12px;border-radius:9px;background:#fff8ed;border:1px solid #f1d3a3;color:#7b4d12;font-size:12.5px;margin-top:10px;}
.teacher-block-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
.teacher-block-grid label{font-size:11px;padding:6px 7px;border:1px solid var(--line2);border-radius:7px;background:#faf9f5;cursor:pointer;}
.teacher-block-grid input{margin-right:5px;}
@media(max-width:980px){.auto-grid{grid-template-columns:1fr;}}
@media(max-width:640px){.auto-form{grid-template-columns:1fr;}.auto-summary{grid-template-columns:repeat(2,1fr);}.teacher-block-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}


/* ---- layout ---- */
.wrap{max-width:1280px;margin:0 auto;padding:26px 22px 70px;}
.center-wrap{min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;padding:30px;}

/* ---- start screen ---- */
.start-card{
  background:var(--card);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:44px 46px;
  max-width:480px;width:100%;
  border-top:5px solid var(--gold);
}
.start-card .eyebrow{color:var(--sub);font-size:13px;letter-spacing:.02em;margin-bottom:6px;}
.start-card h1{font-size:23px;margin:0 0 4px;color:var(--navy);}
.start-card p.lead{color:var(--sub);font-size:13.5px;margin:0 0 26px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;color:var(--navy);font-weight:600;margin-bottom:7px;}
.field .term-row{display:flex;gap:8px;}
.term-btn{
  flex:1;padding:11px 0;border-radius:9px;border:1.5px solid var(--line2);
  background:#fff;font-size:14.5px;font-weight:600;color:var(--sub);transition:.12s;
}
.term-btn.active{border-color:var(--navy);background:var(--navy);color:#fff;}
.field input[type=number]{
  width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid var(--line2);
  font-size:15px;color:var(--ink);
}
.field input:focus,.term-btn:focus{outline:2px solid var(--gold);outline-offset:1px;}
.go-btn{
  width:100%;padding:13px 0;border-radius:9px;border:none;
  background:var(--navy);color:#fff;font-weight:600;font-size:15px;
  margin-top:8px;transition:.15s;
}
.go-btn:hover{background:var(--navy3);}
.go-btn:disabled{background:#b9c2cf;cursor:not-allowed;}
.hint{font-size:12px;color:var(--sub);margin-top:10px;}

/* ---- document archive ---- */
.doc-upload-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px;}
.doc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
.doc-grid .field{margin:0;}
.doc-upload-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:12px;}
.doc-file-input{flex:1;min-width:260px;border:1.5px dashed var(--line2);background:#faf9f5;border-radius:10px;padding:9px;}
.doc-list{display:grid;gap:10px;margin-top:14px;}
.doc-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;}
.doc-main{min-width:0;}
.doc-name{font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.doc-meta{font-size:12px;color:var(--sub);margin-top:2px;}
.doc-actions{display:flex;gap:8px;flex-wrap:wrap;flex:none;}
.btn.small{padding:6px 10px;font-size:12.5px;}
.btn.danger-outline{border-color:var(--red);color:var(--red);}
.btn.danger-outline:hover{background:var(--red);color:#fff;}
.doc-empty{padding:22px;text-align:center;border:1px dashed var(--line2);border-radius:10px;color:var(--sub);background:#fbfaf7;}
@media(max-width:900px){.doc-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:640px){.doc-grid{grid-template-columns:1fr;}.doc-item{align-items:flex-start;flex-direction:column;}.doc-actions{width:100%;}}

/* ---- section heading ---- */
.section-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.section-head h2{font-size:19px;margin:0;color:var(--navy);}
.section-head .sh-sub{font-size:12.5px;color:var(--sub);}

/* ---- menu grid (main actions) ---- */
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0 6px;}
@media(max-width:760px){.menu-grid{grid-template-columns:1fr 1fr;}}
.menu-card{
  background:var(--card);border-radius:14px;padding:20px 18px;
  box-shadow:var(--shadow);border:1px solid var(--line);
  text-align:left;transition:.15s;display:flex;flex-direction:column;gap:6px;
}
.menu-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,43,82,.13);border-color:var(--navy3);}
.menu-card .mc-ico{
  width:38px;height:38px;border-radius:9px;background:var(--navy);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-family:'Prompt';font-weight:600;
  margin-bottom:2px;
}
.menu-card .mc-title{font-family:'Prompt';font-weight:600;font-size:15px;color:var(--navy);}
.menu-card .mc-desc{font-size:12.5px;color:var(--sub);}
.menu-card.home{background:var(--navy);color:#fff;}
.menu-card.home .mc-title,.menu-card.home .mc-desc{color:#fff;}
.menu-card.home .mc-ico{background:var(--gold);color:var(--navy);}

/* ---- class card list (home subjects) ---- */
.addteacher-bar{display:flex;justify-content:flex-end;margin-bottom:14px;}
.btn{
  padding:9px 16px;border-radius:8px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);
  font-size:13.5px;font-weight:600;transition:.13s;
}
.btn:hover{background:var(--navy);color:#fff;}
.btn.primary{background:var(--navy);color:#fff;}
.btn.primary:hover{background:var(--navy3);}
.btn.danger{border-color:var(--red);color:var(--red);}
.btn.danger:hover{background:var(--red);color:#fff;}
.btn.sm{padding:6px 12px;font-size:12.5px;}

.class-block{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden;border:1px solid var(--line);}
.class-block .cb-head{
  padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  border-bottom:1px solid var(--line);
}
.cb-head .cb-title{display:flex;align-items:center;gap:10px;}
.cb-tag{width:9px;height:9px;border-radius:50%;flex:none;}
.cb-head h3{margin:0;font-size:15.5px;color:var(--navy);}
.cb-head .cb-dept{font-size:12px;color:var(--sub);}
.cb-head .cb-total{font-size:12.5px;color:var(--sub);background:var(--paper);padding:4px 10px;border-radius:100px;}
table.subj-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.subj-table th{
  text-align:left;background:var(--paper);color:var(--sub);font-weight:600;font-size:12px;
  padding:8px 10px;border-bottom:1px solid var(--line);
}
table.subj-table td{padding:8px 10px;border-bottom:1px solid #f0efe8;vertical-align:middle;}
table.subj-table tr:last-child td{border-bottom:none;}
table.subj-table td.num{text-align:center;color:var(--sub);width:34px;}
table.subj-table td.code{font-family:monospace;font-size:12.5px;color:var(--sub);white-space:nowrap;}
.teach-select{
  padding:6px 9px;border-radius:7px;border:1.5px solid var(--line2);font-size:12.8px;min-width:150px;background:#fff;
}
.teach-select.assigned{border-color:var(--green);}
.empty-note{padding:24px;text-align:center;color:var(--sub);font-size:13.5px;}

/* ---- tabs (class/teacher/room selector) ---- */
.tabbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.tab-chip{
  padding:8px 15px;border-radius:100px;border:1.5px solid var(--line2);background:#fff;
  font-size:13px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:7px;transition:.12s;
}
.tab-chip .dot{width:8px;height:8px;border-radius:50%;}
.tab-chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.tab-chip.active .dot{outline:2px solid rgba(255,255,255,.5);}

/* ---- lockdays page ---- */
.day-lock-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:9px;background:#fff;
}
.day-lock-row.locked{background:#faf4ea;border-color:var(--gold);}
.day-lock-row .dl-name{font-weight:600;color:var(--navy);font-size:14.5px;width:120px;}
.day-lock-row .dl-note{font-size:12px;color:var(--sub);flex:1;}
.toggle{
  width:46px;height:26px;border-radius:100px;background:#d6dbe3;position:relative;border:none;flex:none;transition:.15s;
}
.toggle.on{background:var(--navy);}
.toggle .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.toggle.on .knob{left:23px;}

/* ---- subject side ref list for lockdays ---- */
.ref-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px;}
@media(max-width:700px){.ref-cols{grid-template-columns:1fr;}}
.ref-col{background:#eef4fb;border:1px solid #d8e6f5;border-radius:10px;padding:10px 14px;}
.ref-col .ref-title{font-size:12px;color:var(--navy3);font-weight:700;margin-bottom:6px;}
.ref-item{font-size:12.3px;padding:3px 0;color:var(--ink);display:flex;justify-content:space-between;gap:8px;}
.ref-item span.rn{color:var(--sub);}

/* ---- timetable grid ---- */
.sched-layout{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start;}
@media(max-width:900px){.sched-layout{grid-template-columns:1fr;}}
.side-panel{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;border:1px solid var(--line);position:sticky;top:80px;}
.side-panel h4{margin:0 0 10px;font-size:13.5px;color:var(--navy);font-family:'Prompt';}
.chip-list{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow:auto;}
.subj-chip{
  padding:9px 11px;border-radius:9px;border:1.5px solid var(--line2);background:#fff;cursor:grab;
  font-size:12.5px;line-height:1.4;border-left-width:5px;
}
.subj-chip.placed{opacity:.35;cursor:not-allowed;text-decoration:line-through;}
.subj-chip.nounass{border-style:dashed;opacity:.6;cursor:not-allowed;}
.subj-chip .sc-code{font-family:monospace;color:var(--sub);font-size:11px;}
.subj-chip .sc-name{font-weight:600;color:var(--ink);}
.subj-chip .sc-meta{color:var(--sub);font-size:11px;margin-top:2px;}
.subj-chip.teacher-pending{border-left-width:5px;background:#f8fbff;}
.teacher-pending-group{margin-bottom:12px;}
.teacher-pending-title{font-size:11.5px;font-weight:700;color:var(--navy);margin:0 0 6px;padding-left:4px;}
.teacher-rule-note{padding:9px 11px;margin:0 0 12px;border-radius:8px;background:#fff8ed;border:1px solid #f1d3a3;color:#7b4d12;font-size:12px;}
.direct-subj-fields{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px;}
.direct-subj-field{width:100%;box-sizing:border-box;padding:6px 7px;border:1px solid var(--line2);border-radius:7px;background:#fff;font-size:11px;outline:none;}
.direct-subj-field:focus{border-color:var(--navy);box-shadow:0 0 0 2px rgba(31,55,86,.08);}
.direct-subj-label{font-size:9.5px;color:var(--sub);display:block;margin:0 0 2px;}
@media(max-width:640px){.direct-subj-fields{grid-template-columns:1fr;}}


.grid-scroll{overflow-x:auto;background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;}
.ttable{
  display:grid;
  grid-template-columns:88px repeat(11,minmax(74px,1fr));
  grid-auto-rows:56px;
  min-width:920px;
  gap:3px;
}
.ttable .hcell{
  font-size:11px;color:var(--sub);text-align:center;display:flex;flex-direction:column;justify-content:center;
  background:var(--paper);border-radius:6px;font-weight:600;
}
.ttable .daycell{
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy);
  background:var(--paper);border-radius:6px;font-size:13px;
}
.ttable .cell{
  border-radius:6px;background:#fbfaf6;border:1.5px dashed #e4e2d7;
  position:relative;
}
.ttable .cell.locked{background:repeating-linear-gradient(45deg,var(--grey-lock),var(--grey-lock) 6px,#ddd9cd 6px,#ddd9cd 12px);border-style:solid;border-color:#cfccc0;}
.ttable .cell.fixed{background:#efe6d2;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:11px;color:#7a5c1e;font-weight:600;text-align:center;padding:2px;}
.ttable .cell.over{background:#eef7ef;border-color:var(--green);}
.ttable .cell.unavailable{background:repeating-linear-gradient(45deg,#e5e7eb,#e5e7eb 7px,#d1d5db 7px,#d1d5db 14px);border-style:solid;border-color:#b8bec7;cursor:not-allowed;position:relative;}
.ttable .cell.unavailable::after{content:'ลงไม่ได้';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:10px;font-weight:700;pointer-events:none;}
.ttable .cell.drop-ok{background:#eef7ef;border-color:#77a77d;border-style:solid;box-shadow:inset 0 0 0 2px rgba(70,130,80,.12);}
.ttable .cell.drop-bad{background:repeating-linear-gradient(45deg,#e5e7eb,#e5e7eb 7px,#d1d5db 7px,#d1d5db 14px);border-color:#9ca3af;border-style:solid;}
.block{
  border-radius:7px;color:#fff;padding:6px 8px;font-size:11.3px;line-height:1.35;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15);
  cursor:grab;overflow:hidden;
}
.block:active{cursor:grabbing;}
.block[draggable="true"]{user-select:none;}
.block b{font-size:11.8px;}
.block .bl-sub{opacity:.92;}
.block .bl-room{opacity:.85;font-size:10.3px;}

/* ---- modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,40,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-box{background:#fff;border-radius:14px;padding:24px 26px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-box h3{margin:0 0 4px;color:var(--navy);font-size:17px;}
.modal-box .mb-row{font-size:13.5px;color:var(--sub);margin:10px 0;}
.modal-box .mb-row b{color:var(--ink);}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}

/* ---- curriculum table page ---- */
.curr-table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
.curr-table th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left;font-size:12px;font-weight:600;}
.curr-table td{padding:9px 12px;border-bottom:1px solid var(--line);}
.curr-table tr:last-child td{border-bottom:none;}
.curr-table td.code{font-family:monospace;color:var(--sub);font-size:12px;}
.curr-table td.num{text-align:center;width:44px;color:var(--sub);}
.curr-total{background:var(--paper);font-weight:700;}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:200;opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

const LUNCH_PERIODS = [4,5,6];
function isVocationalClass(classId){ return VOCATIONAL_CLASS_IDS.has(String(classId)); }
function isPvsClass(classId){ return PVS_CLASS_IDS.has(String(classId)); }
function hasLunchBreakAfterPlacement(classId, day, ignoreIds, candidateStart, candidateHours){
  const candidateEnd=Number(candidateStart)+Number(candidateHours||1)-1;
  return LUNCH_PERIODS.some(lp=>{
    const occupiedByCandidate = lp>=Number(candidateStart) && lp<=candidateEnd;
    if(occupiedByCandidate) return false;
    return !curTerm().placements.some(p=>p.classId===classId && p.day===day && !ignoreIds.includes(p.id) && lp>=p.period && lp<p.period+p.hours);
  });
}
function lunchBreakReason(){ return 'นักเรียนแต่ละห้องต้องมีเวลาพักรับประทานอาหารกลางวันอย่างน้อย 1 ชั่วโมง: 11:00-12:00 หรือ 12:00-13:00 หรือกรณีจำเป็น 13:00-14:00'; }
function isActivitySubject(subjectOrPlacement){
  const code=String(subjectOrPlacement?.code||'');
  const name=String(subjectOrPlacement?.name||'');
  return name.includes('กิจกรรม') || code.startsWith('20000-200');
}
function placementIsActivity(p){ return isActivitySubject(p); }

// กติกาเดิม: ห้ามครูคนเดียวกันสอนต่างวิชาต่อเนื่องกันในห้องเดียวกัน
// ยกเว้นวิชาแรกเป็นกิจกรรม และครูคนเดียวกันสอนคนละห้องต่อเนื่องกันได้
// ข้อยกเว้นใหม่: ปวส.2/1 และ ปวส.2/3 ในภาคเรียนที่ 2 เท่านั้น อนุญาตให้ต่อเนื่องได้
function teacherContinuityConflict(existing, candidate){
  if(!existing || existing.teacherId!==candidate.teacherId) return false;
  if(existing.day!==candidate.day) return false;
  if(isPvs2Term2(existing.classId) || isPvs2Term2(candidate.classId)) return false;
  if(existing.classId!==candidate.classId) return false;

  const sameSubject = String(existing.code)===String(candidate.code) && String(existing.name)===String(candidate.name);
  if(sameSubject) return false;

  const aStart=Number(existing.period), aEnd=aStart+Number(existing.hours||1)-1;
  const bStart=Number(candidate.period), bEnd=bStart+Number(candidate.hours||1)-1;
  const directAdjacent = aEnd+1===bStart || bEnd+1===aStart;
  const crossesBreak4 = (aEnd===3 && bStart===5) || (bEnd===3 && aStart===5);

  if(directAdjacent || crossesBreak4){
    const firstIsExisting = aEnd < bStart;
    const firstIsActivity = firstIsExisting ? placementIsActivity(existing) : placementIsActivity(candidate);
    return !firstIsActivity;
  }
  return false;
}
function teacherContinuityReason(){ return 'กติกาปกติ: ครูคนเดียวกันไม่ควรสอนต่างวิชาต่อเนื่องกันในห้องเดียวกัน; ยกเว้น ปวส.2/1 และ ปวส.2/3 ภาคเรียนที่ 2 ที่อนุญาตให้สอนต่อเนื่องได้'; }
function vocationalTimeCheck(classId, start, hours){

    if(isPvs2Term2(classId) && end>PVS2_LAST_PERIOD){

    }
    return {ok:true};
  }
  if(!isVocationalClass(classId)) return {ok:true};
  const end=Number(start)+Number(hours||1)-1;
  if(end>VOCATIONAL_LAST_PERIOD) return {ok:false,reason:'ปวช.1-3 ไม่สามารถจัดตารางเกิน 17:00 น. (สูงสุดคาบ 9)'};
  return {ok:true};
}

async function storeGet(key){
  try{ if(window.storage && window.storage.get){ const r = await window.storage.get(key,false); if(r && r.value!=null) return JSON.parse(r.value); } }catch(e){}
  try{ const v=localStorage.getItem(key); return v==null?null:JSON.parse(v); }catch(e){ return null; }
}
async function storeSet(key,val){
  let ok=false;
  try{ if(window.storage && window.storage.set){ await window.storage.set(key, JSON.stringify(val), false); ok=true; } }catch(e){ console.warn('storage set failed',e); }
  if(!ok){ try{ localStorage.setItem(key, JSON.stringify(val)); ok=true; }catch(e){} }
  return ok;
}
/* =========================================================
   DOCUMENT ARCHIVE — เก็บไฟล์ไว้ใน IndexedDB จนกว่าจะลบเอง
========================================================= */
const DOCUMENT_DB = 'schedule_document_archive_v1';
const DOCUMENT_STORE = 'documents';
const DOCUMENT_VERSION = 1;
function openDocumentDB(){
  return new Promise((resolve,reject)=>{
    try{
      const req=indexedDB.open(DOCUMENT_DB,DOCUMENT_VERSION);
      req.onupgradeneeded=()=>{
        const db=req.result;
        if(!db.objectStoreNames.contains(DOCUMENT_STORE)){
          const st=db.createObjectStore(DOCUMENT_STORE,{keyPath:'id'});
          st.createIndex('savedAt','savedAt',{unique:false});
          st.createIndex('termKey','termKey',{unique:false});
        }
      };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||new Error('เปิดฐานข้อมูลเอกสารไม่สำเร็จ'));
    }catch(e){ reject(e); }
  });
}
async function documentList(){
  try{
    const db=await openDocumentDB();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(DOCUMENT_STORE,'readonly');
      const req=tx.objectStore(DOCUMENT_STORE).getAll();
      req.onsuccess=()=>resolve((req.result||[]).sort((a,b)=>String(b.savedAt).localeCompare(String(a.savedAt))));
      req.onerror=()=>reject(req.error);
      tx.oncomplete=()=>db.close();
    });
  }catch(e){ console.warn('documentList failed',e); return []; }
}
async function documentSave(doc){
  const db=await openDocumentDB();
  return await new Promise((resolve,reject)=>{
    const tx=db.transaction(DOCUMENT_STORE,'readwrite');
    tx.objectStore(DOCUMENT_STORE).put(doc);
    tx.oncomplete=()=>{db.close(); resolve(true);};
    tx.onerror=()=>{db.close(); reject(tx.error||new Error('บันทึกเอกสารไม่สำเร็จ'));};
  });
}
async function documentGet(id){
  const db=await openDocumentDB();
  return await new Promise((resolve,reject)=>{
    const tx=db.transaction(DOCUMENT_STORE,'readonly');
    const req=tx.objectStore(DOCUMENT_STORE).get(id);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
    tx.oncomplete=()=>db.close();
  });
}
async function documentDelete(id){
  const db=await openDocumentDB();
  return await new Promise((resolve,reject)=>{
    const tx=db.transaction(DOCUMENT_STORE,'readwrite');
    tx.objectStore(DOCUMENT_STORE).delete(id);
    tx.oncomplete=()=>{db.close(); resolve(true);};
    tx.onerror=()=>{db.close(); reject(tx.error||new Error('ลบเอกสารไม่สำเร็จ'));};
  });
}
function formatBytes(n){ n=Number(n||0); if(n<1024) return n+' B'; if(n<1024*1024) return (n/1024).toFixed(1)+' KB'; if(n<1024*1024*1024) return (n/1024/1024).toFixed(1)+' MB'; return (n/1024/1024/1024).toFixed(2)+' GB'; }
function formatDocDate(iso){ try{return new Date(iso).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});}catch(e){return iso||'';} }
function safeFileType(name,type){ const ext=String(name||'').split('.').pop().toLowerCase(); return type || (ext ? '.'+ext : 'ไฟล์'); }

function termKey(){ return STATE.term+'-'+STATE.year; }
function curTerm(){
  const k = termKey();
  if(!STATE.terms[k]){
    STATE.terms[k] = {subjects:{}, locks:{}, teacherLocks:{}, placements:[]};
  }
  const t=STATE.terms[k];
  if(!t.teacherLocks) t.teacherLocks={};
  if(!Array.isArray(t.placements)) t.placements=[];
  return t;
}

function buildSubjectsForClass(classId){
  const cd = CURRICULUM[classId];
  if(!cd) return [];
  const entries = cd.entries.filter(e=>String(e.year)===String(STATE.year) && Number(e.term)===Number(STATE.term));

  return entries.map(e=>{
    const baseHours = Math.max(1, Number(e.t||0)+Number(e.p||0));
    // เฉพาะวิชาโครงงานที่มีชั่วโมงตามแผนมากกว่า 4 ชม. ให้ลงตาราง 4 ชม.
    // รายวิชาที่มีคำว่า "โครงงาน" แต่ตามแผนมีเพียง 2 ชม. ยังคงใช้ 2 ชม.
    const isMainProject = String(e.name||'').includes('โครงงาน') && baseHours>4;
    return {
      code:e.code, name:e.name, t:e.t, p:e.p, n:e.n,
      hours: isMainProject ? 4 : baseHours,
      teacherId:null, color:null
    };
  });
}

function validateRequiredSubjects(classId, subjects){
  // ใช้ “รหัสวิชา” เป็นตัวตรวจสอบหลัก ไม่ใช้ชื่อวิชาหรือจำนวนวิชา

  const byCode = new Map(subjects.map(s=>[String(s.code),s]));
  const missing = expected.filter(code=>!byCode.has(String(code)));

}

function seedReferenceSchedule2569T2(){
  if(String(STATE.year)!=='2569' || Number(STATE.term)!==2) return;
  const t = curTerm();
  // ซิงก์ตารางเรียนจากไฟล์ Excel แนบเวอร์ชันล่าสุด และไม่ทับการแก้ไขภายหลังจนกว่าจะเปลี่ยนเวอร์ชัน
  if(t.referenceSeedVersion === '2026-09-20-excel-v17') return;
  ensureTermSubjectsForSeed();
  t.placements = [];
  REFERENCE_SCHEDULE_2569_T2.forEach(([classId,code,day,period,teacherId,room,excelHours],i)=>{
    const subs = t.subjects[classId] || [];
    const idx = subs.findIndex(s=>String(s.code)===String(code));
    if(idx<0){ console.warn('ไม่พบรหัสวิชาในหลักสูตร:',classId,code); return; }
    subs[idx].teacherId = teacherId;
    t.placements.push({
      id:'ref2569t2_excel_'+i,
      classId, subIdx:idx, code:subs[idx].code, name:subs[idx].name,
      teacherId, day, period, hours:Number(excelHours)||1, room:room||''
    });
  });
  // ล็อกวันอังคารของ ปวช.1/1 ตามไฟล์ต้นฉบับ
  t.locks['ch1-1'] = [1];
  t.referenceSeedVersion = '2026-09-20-excel-v17';
}

function applyTeacherCorrections2569T2(){
  if(String(STATE.year)!=='2569' || Number(STATE.term)!==2) return;
  const t = curTerm();
  const rules = {
    's2-1': {
      '30215-2005':'pawinee',
      '30000-2005':'pawinee',
      '30215-2007':'anyarat',
      '30215-2015':'anyarat'
    },
    's2-3': {
      '30215-2005':'pawinee',
      '30000-2005':'pawinee',
      '30215-2007':'anyarat',
      '30215-2015':'anyarat'
    }
  };
  Object.entries(rules).forEach(([classId, byCode])=>{
    const subs = t.subjects[classId] || [];
    subs.forEach(sub=>{
      const teacherId = byCode[String(sub.code)];
      if(teacherId) sub.teacherId = teacherId;
    });
    t.placements.forEach(pl=>{
      if(pl.classId===classId){
        const teacherId = byCode[String(pl.code)];
        if(teacherId) pl.teacherId = teacherId;
      }
    });
  });
  t.teacherCorrectionVersion = '2026-09-04-r3';
}

function ensureTermSubjectsForSeed(){
  const t = curTerm();
  CLASSES.forEach(c=>{
    const fresh = validateRequiredSubjects(c.id, buildSubjectsForClass(c.id));
    const old = Array.isArray(t.subjects[c.id]) ? t.subjects[c.id] : [];
    t.subjects[c.id] = fresh.map(f=>{
      const prev=old.find(o=>String(o.code)===String(f.code));
      return prev ? {...f, teacherId:prev.teacherId||null, color:prev.color||null} : f;
    });
  });
}

function ensureTermSubjects(){
  const t = curTerm();
  CLASSES.forEach(c=>{
    const fresh = validateRequiredSubjects(c.id, buildSubjectsForClass(c.id));
    const old = Array.isArray(t.subjects[c.id]) ? t.subjects[c.id] : [];
    // รวมข้อมูลใหม่กับข้อมูลเดิม แทนการปล่อยให้ข้อมูลเก่าที่ดึงไม่ครบค้างอยู่
    const merged = fresh.map(f=>{
      const prev = old.find(o=>String(o.code)===String(f.code));
      return prev ? {...f, teacherId:prev.teacherId||null, color:prev.color||null} : f;
    });
    t.subjects[c.id] = merged;
  });
}

async function saveTeachers(){ await storeSet('sched_teachers', STATE.teachers); }
async function saveRooms(){ await storeSet('sched_rooms', ROOMS); }
async function saveTermData(){ return await storeSet('sched_term_'+termKey(), curTerm()); }
async function saveLastPointer(){ await storeSet('sched_last', {term:STATE.term, year:STATE.year}); }

async function initApp(){
  await loadDocuments();
  const teachers = await storeGet('sched_teachers');
  if(teachers && teachers.length) STATE.teachers = teachers;
  const savedRooms = await storeGet('sched_rooms');
  if(Array.isArray(savedRooms) && savedRooms.length){ ROOMS = [...new Set([...ROOMS, ...savedRooms.map(String)])]; STATE.rooms = [...ROOMS]; }
  const last = await storeGet('sched_last');
  STATE.ready = true;
  if(last && last.term && last.year){
    STATE.term = last.term; STATE.year = last.year;
    const t = await storeGet('sched_term_'+STATE.term+'-'+STATE.year);
    if(t){ STATE.terms[STATE.term+'-'+STATE.year] = t; }
    ensureTermSubjects();
    if(String(STATE.year)==='2569' && Number(STATE.term)===2){
      seedReferenceSchedule2569T2();
      applyTeacherCorrections2569T2();
      await saveTermData();
    }
    STATE.view='home';
  } else {
    // เปิดระบบครั้งแรกที่ภาคเรียนต้นฉบับ 2/2569 พร้อมข้อมูลตารางเรียน
    STATE.term = 2; STATE.year = '2569';
    ensureTermSubjects();
    seedReferenceSchedule2569T2();
    applyTeacherCorrections2569T2();
    await saveTermData();
    await saveLastPointer();
    STATE.view='home';
  }
  render();
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>el.classList.remove('show'), 2200);
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function classById(id){ return CLASSES.find(c=>c.id===id); }
function teacherById(id){ return STATE.teachers.find(t=>t.id===id); }
function subjectsOf(classId){ ensureTermSubjects(); return curTerm().subjects[classId]||[]; }
function locksOf(classId){ const t=curTerm(); return t.locks[classId]||[]; }
function placementsOf(classId){ return curTerm().placements.filter(p=>p.classId===classId); }
function placementsOfTeacher(teacherId){ return curTerm().placements.filter(p=>p.teacherId===teacherId); }
function placementsOfRoom(roomId){ return curTerm().placements.filter(p=>p.room===roomId); }
function unassignedRoomPlacements(){ return curTerm().placements.filter(p=>!p.room); }

}

function bindStart(){
  let chosenTerm = 2;
  const row = document.getElementById('termRow');
  [...row.children].forEach(b=>{
    if(Number(b.dataset.term)===chosenTerm) b.classList.add('active');
    b.onclick=()=>{ [...row.children].forEach(x=>x.classList.remove('active')); b.classList.add('active'); chosenTerm=Number(b.dataset.term); };
  });
  document.getElementById('goBtn').onclick = async ()=>{
    const year = Number(document.getElementById('yearInput').value);
    if(!year || year<2500){ toast('กรุณากรอกปีการศึกษาให้ถูกต้อง'); return; }
    STATE.term = chosenTerm; STATE.year = year;
    const existing = await storeGet('sched_term_'+STATE.term+'-'+STATE.year);
    if(existing) STATE.terms[STATE.term+'-'+STATE.year] = existing;
    ensureTermSubjects();
    await saveLastPointer();
    STATE.view='home';
    render();
  };
}

/* =========================================================
   AUTO SCHEDULER
========================================================= */
function autoLockKey(classId, subIdx){ return classId+'|'+subIdx; }
function getAutoLockedPlacement(classId, subIdx){
  return curTerm().placements.find(p=>p.classId===classId && Number(p.subIdx)===Number(subIdx) && p.autoLocked);
}
function teacherBlocked(teacherId, day, period){
  const tm=curTerm().teacherLocks||{};
  const arr=tm[teacherId] && tm[teacherId][day] ? tm[teacherId][day] : [];
  return arr.includes(period);
}
function classBusyAt(classId, day, period, ignoreIds=[]){
  return curTerm().placements.some(p=>p.classId===classId && p.day===day && !ignoreIds.includes(p.id) && period>=p.period && period<p.period+p.hours);
}
function teacherBusyAt(teacherId, day, period, ignoreIds=[]){
  return curTerm().placements.some(p=>p.teacherId===teacherId && p.day===day && !ignoreIds.includes(p.id) && period>=p.period && period<p.period+p.hours);
}
function roomBusyAt(room, day, period, ignoreIds=[]){
  return curTerm().placements.some(p=>p.room===room && p.day===day && !ignoreIds.includes(p.id) && period>=p.period && period<p.period+p.hours);
}
function classDayLocked(classId, day){ return locksOf(classId).includes(day); }
function canAutoPlaceGroup(group, day, start){
  const hours=Math.max(...group.items.map(x=>Number(x.s.hours)||1));
  if(start+hours-1>PERIODS.length) return {ok:false,reason:'คาบไม่พอ'};
  for(const item of group.items){
    const vc=vocationalTimeCheck(item.classId,start,Number(item.s.hours)||1);
    if(!vc.ok) return vc;
  }
  const groupClassIds=new Set(group.items.map(x=>x.classId));
  const ignoreIds=curTerm().placements.filter(p=>groupClassIds.has(p.classId) && String(p.code)===String(group.code) && String(p.name)===String(group.name) && p.teacherId===group.teacherId).map(p=>p.id);
  const seenClasses=new Set();
  for(const item of group.items){
    if(seenClasses.has(item.classId)) continue;
    seenClasses.add(item.classId);
    if(classDayLocked(item.classId,day)) return {ok:false,reason:'มีห้องเรียนถูกล็อควันไว้'};
    for(let k=0;k<item.s.hours;k++){
      const pp=start+k;
      if(day===HOMEROOM_DAY && pp===1) return {ok:false,reason:'ชน Home-Room'};
      if(classBusyAt(item.classId,day,pp,ignoreIds)) return {ok:false,reason:'ห้องเรียนมีวิชาอยู่แล้ว'};
    }
    // ตารางอัตโนมัติต้องเหลือช่วงพักกลางวันให้ห้องนี้อย่างน้อย 1 ชั่วโมง
    if(!hasLunchBreakAfterPlacement(item.classId,day,ignoreIds,start,Number(item.s.hours)||1)) return {ok:false,reason:lunchBreakReason()};
  }
  const tid=group.teacherId;
  for(let k=0;k<hours;k++){
    const pp=start+k;
    if(teacherBlocked(tid,day,pp)) return {ok:false,reason:'ครูถูกล็อคช่วงนี้'};
    const clashes=curTerm().placements.filter(p=>p.teacherId===tid && p.day===day && pp>=p.period && pp<p.period+p.hours && !ignoreIds.includes(p.id));
    if(clashes.some(p=>String(p.code)!==String(group.code)||String(p.name)!==String(group.name))) return {ok:false,reason:'ตารางครูชน'};
  }
  const candidate={teacherId:tid,day,period:start,hours,code:group.code,name:group.name};
  const continuity=curTerm().placements.filter(p=>p.teacherId===tid && p.day===day && !ignoreIds.includes(p.id))
    .some(p=>teacherContinuityConflict(p,candidate));
  if(continuity) return {ok:false,reason:teacherContinuityReason()};
  const candidateRooms=ROOMS.filter(r=>{
    for(let k=0;k<hours;k++) if(roomBusyAt(r,day,start+k,ignoreIds)) return false;
    return true;
  });
  if(!candidateRooms.length) return {ok:false,reason:'ไม่มีห้องว่าง'};
  return {ok:true,hours,room:candidateRooms[0]};
}
function autoPlaceGroup(group,day,start,room){
  const t=curTerm();
  const ids=[];
  for(const item of group.items){
    const existing=t.placements.find(p=>p.classId===item.classId && Number(p.subIdx)===Number(item.idx));
    if(existing){ ids.push(existing.id); continue; }
    const id='auto_'+Date.now()+'_'+Math.floor(Math.random()*100000)+'_'+item.classId;
    t.placements.push({id,classId:item.classId,subIdx:item.idx,code:item.s.code,name:item.s.name,teacherId:item.s.teacherId,day,period:start,hours:item.s.hours,room,autoGenerated:true});
    ids.push(id);
  }
  return ids;
}
function buildAutoGroups(){
  const t=curTerm(), groups=new Map();
  CLASSES.forEach(c=>{
    const subs=subjectsOf(c.id);
    subs.forEach((s,idx)=>{
      if(!s.teacherId) return;
      if(t.placements.some(p=>p.classId===c.id && Number(p.subIdx)===Number(idx))) return;
      const key=[s.teacherId,String(s.code),String(s.name)].join('|');
      if(!groups.has(key)) groups.set(key,{key,teacherId:s.teacherId,code:s.code,name:s.name,items:[]});
      groups.get(key).items.push({classId:c.id,idx,s});
    });
  });
  return [...groups.values()].sort((a,b)=>{
    const ha=Math.max(...a.items.map(x=>Number(x.s.hours)||1)), hb=Math.max(...b.items.map(x=>Number(x.s.hours)||1));
    return hb-ha || b.items.length-a.items.length || String(a.code).localeCompare(String(b.code));
  });
}
function autoScheduleAll(){
  const groups=buildAutoGroups();
  const placedGroups=[], failed=[];
  // First: groups that already have a locked placement for one member; try to merge all others into that time.
  const t=curTerm();
  for(const g of groups){
    const anchor=g.items.map(it=>getAutoLockedPlacement(it.classId,it.idx)).find(Boolean);
    if(anchor){
      const check=canAutoPlaceGroup(g,anchor.day,anchor.period);
      if(check.ok){
        const room=anchor.room || check.room;
        if(!anchor.room || !roomBusyAt(room,anchor.day,anchor.period,[anchor.id])) anchor.room=room;
        autoPlaceGroup(g,anchor.day,anchor.period,room);
        placedGroups.push(g); g.__done=true;
      }
    }
  }
  for(const g of groups){
    if(g.__done) continue;
    let best=null;
    for(const day of [0,1,3,4,2]){
      for(const start of PERIODS){
        const check=canAutoPlaceGroup(g,day,start);
        if(!check.ok) continue;
        // scoring: prefer less crowded day, earlier gaps, and grouped classes.
        let dayLoad=0;
        for(const it of g.items){ dayLoad += t.placements.filter(p=>p.classId===it.classId&&p.day===day).reduce((a,p)=>a+p.hours,0); }
        // ให้ความสำคัญกับการจัดพักกลางวันเร็วที่สุดเท่าที่ทำได้ โดยยังคงให้ 13:00-14:00 เป็นตัวเลือกสำรอง
        let lunchScore=0;
        for(const it of g.items){
          const availableLunch=LUNCH_PERIODS.filter(lp=>{
            if(lp>=start && lp<=start+(Number(it.s.hours)||1)-1) return false;
            return !t.placements.some(p=>p.classId===it.classId&&p.day===day&&lp>=p.period&&lp<p.period+p.hours);
          });
          if(availableLunch.length) lunchScore += availableLunch[0]===4 ? 0 : availableLunch[0]===5 ? 2 : 5;
        }
        const score=dayLoad*10+start + (day===2?4:0) + lunchScore*20;
        if(!best || score<best.score) best={day,start,room:check.room,score};
      }
    }
    if(best){ autoPlaceGroup(g,best.day,best.start,best.room); placedGroups.push(g); }
    else failed.push(g);
  }
  return {groups,placedGroups,failed};
}

function bindAutoSchedule(){
  const cs=document.getElementById('autoClassSelect'), ss=document.getElementById('autoSubjectSelect');
  const fillSubjects=()=>{ if(!cs||!ss)return; const subs=subjectsOf(cs.value); ss.innerHTML=subs.map((s,i)=>`<option value="${i}">${esc(s.code)} — ${esc(s.name)} (${s.hours} ชม.)</option>`).join('') || '<option value="">ไม่มีรายวิชา</option>'; };
  fillSubjects(); if(cs) cs.onchange=fillSubjects;
  const lockBtn=document.getElementById('lockAutoSubject');
  if(lockBtn) lockBtn.onclick=async()=>{
    const classId=cs?.value, idx=Number(ss?.value), day=Number(document.getElementById('autoDaySelect')?.value), period=Number(document.getElementById('autoPeriodSelect')?.value); const s=subjectsOf(classId)[idx]; if(!s)return;
    if(!s.teacherId){toast('กรุณากำหนดผู้สอนก่อนล็อครายวิชา');return;}
    if(curTerm().placements.some(p=>p.classId===classId&&Number(p.subIdx)===idx)){toast('รายวิชานี้มีอยู่ในตารางแล้ว');return;}
    const check=canAutoPlaceGroup({teacherId:s.teacherId,code:s.code,name:s.name,items:[{classId,idx,s}]},day,period); if(!check.ok){toast('ล็อคไม่ได้: '+check.reason);return;}
    curTerm().placements.push({id:'lock_'+Date.now()+'_'+Math.floor(Math.random()*1000),classId,subIdx:idx,code:s.code,name:s.name,teacherId:s.teacherId,day,period,hours:s.hours,room:check.room,autoLocked:true});
    await saveTermData(); toast('ล็อครายวิชาเรียบร้อย'); render();
  };
  document.querySelectorAll('[data-auto-unlock]').forEach(btn=>btn.onclick=async()=>{const p=curTerm().placements.find(x=>x.id===btn.dataset.autoUnlock);if(p){curTerm().placements.splice(curTerm().placements.indexOf(p),1);await saveTermData();toast('ปลดล็อครายวิชาแล้ว');render();}});
  const ts=document.getElementById('autoTeacherLockSelect'), td=document.getElementById('autoTeacherLockDay'), tp=document.getElementById('autoTeacherPeriods');
  const fillTeacherPeriods=()=>{ if(!ts||!td||!tp)return; const tid=ts.value, day=Number(td.value), arr=(curTerm().teacherLocks?.[tid]?.[day]||[]); tp.innerHTML=PERIODS.map(p=>`<label><input type="checkbox" value="${p}" ${arr.includes(p)?'checked':''}>คาบ ${p}</label>`).join(''); };
  fillTeacherPeriods(); if(ts) ts.onchange=fillTeacherPeriods; if(td) td.onchange=fillTeacherPeriods;
  document.getElementById('saveTeacherLocks')?.addEventListener('click',async()=>{const tid=ts.value,day=Number(td.value);const arr=[...tp.querySelectorAll('input:checked')].map(x=>Number(x.value));const t=curTerm();if(!t.teacherLocks)t.teacherLocks={};if(!t.teacherLocks[tid])t.teacherLocks[tid]={};t.teacherLocks[tid][day]=arr;await saveTermData();toast('บันทึกล็อคครูเรียบร้อย');render();});
  document.getElementById('clearTeacherLocks')?.addEventListener('click',async()=>{const tid=ts.value,day=Number(td.value);const t=curTerm();if(t.teacherLocks?.[tid]) delete t.teacherLocks[tid][day];await saveTermData();toast('ล้างล็อคครูแล้ว');render();});
  document.getElementById('runAutoSchedule')?.addEventListener('click',async()=>{
    const ok=confirm('ระบบจะจัดเฉพาะวิชาที่ยังไม่มีตารางและมีผู้สอนแล้ว โดยไม่ย้ายวิชาที่มีอยู่เดิม ดำเนินการต่อหรือไม่?'); if(!ok)return;
    const r=autoScheduleAll(); await saveTermData(); await saveHistorySnapshot('จัดตารางอัตโนมัติ');
    let msg=`จัดสำเร็จ ${r.placedGroups.length} กลุ่ม`;
    if(r.failed.length){msg+=` · จัดไม่ได้ ${r.failed.length} กลุ่ม`;}
    alert(msg+(r.failed.length?'\n\nรายวิชาที่จัดไม่ได้:\n'+r.failed.map(g=>g.code+' — '+g.name).join('\n'):'\n\nตรวจสอบตารางเรียน/ตารางสอน/ตารางห้องได้ทันที'));
    render();
  });
  document.getElementById('autoRefresh')?.addEventListener('click',()=>render());
}

function renderClassGrid(c, subs, locks, placed){
  let html = `<div class="ttable">${gridHeaderCells()}`;
  DAYS.forEach((d,di)=>{
    html += `<div class="daycell">${d}${di===FLAG_DAY?'<br><span style="font-weight:400;font-size:9.5px;color:var(--sub)">หน้าเสาธง 07:00-08:00</span>':''}</div>`;
    const dayLocked = locks.includes(di);
    // build occupancy map for this day
    let occ = {}; // period-> placement or 'fixed'
    if(di===HOMEROOM_DAY) occ[1]='fixed:Home-Room';
    placed.filter(p=>p.day===di).forEach(p=>{
      for(let k=0;k<p.hours;k++) occ[p.period+k]=p;
    });
    let skip=0;
    PERIODS.forEach(per=>{
      if(skip>0){ skip--; return; }
      const o = occ[per];
      if(o && o!=='fixed' && typeof o==='object' && o.period===per){
        const s = subs[o.subIdx];
        const t = o.teacherId ? teacherById(o.teacherId) : null;
        html += `<div class="block" draggable="true" style="grid-column:span ${o.hours};background:${t?t.color:'#888'}" data-editplacement="${o.id}" data-dragplacement="${o.id}" title="ลากเพื่อย้ายตำแหน่ง · คลิกเพื่อแก้">
          <b>${esc(s.code)}</b>
          <span class="bl-sub">${t?esc(t.short):''}</span>
          <span class="bl-room">${o.room? '🏫 ห้อง '+esc(o.room) : '🏫 ยังไม่กำหนดห้อง'} · ลากเพื่อย้าย / คลิกเพื่อแก้</span>
        </div>`;
        skip = o.hours-1;
      } else if(typeof o==='string' && o.startsWith('fixed')){
        html += `<div class="cell fixed">${esc(o.split(':')[1])}</div>`;
      } else if(dayLocked){
        html += `<div class="cell locked"></div>`;
      } else if(isVocationalClass(c.id) && per>VOCATIONAL_LAST_PERIOD){
        html += `<div class="cell unavailable"></div>`;
      } else {
        html += `<div class="cell" data-dropcell="${di}|${per}"></div>`;
      }
    });
  });
  html += `</div>`;
  return html;
}

  STATE.curriculumYear = curYear;

  let html = `
  <div class="section-head"><div><h2>ดูแผนการเรียน</h2><div class="sh-sub">ข้อมูลจากแผนการเรียนที่นำเข้าในระบบ (${esc(cd.groupName||'')})</div></div>
    <select class="yearsel" id="curYearSel">
      ${years.map(y=>`<option value="${y}" ${y===curYear?'selected':''}>ปีการศึกษา ${y}</option>`).join('')}
    </select>
  </div>
  ${renderClassTabs(c.id)}`;

  [1,2].forEach(term=>{
    const rows = cd.entries.filter(e=>e.year===curYear && Number(e.term)===term);
    const totT = rows.reduce((a,r)=>a+r.t,0), totP=rows.reduce((a,r)=>a+r.p,0), totN=rows.reduce((a,r)=>a+r.n,0);
    html += `<h3 style="color:var(--navy);font-size:15px;margin:22px 0 10px;">ภาคเรียนที่ ${term} ปีการศึกษา ${curYear}</h3>`;
    if(!rows.length){
      html += `<div class="empty-note">ไม่มีข้อมูลรายวิชาในภาคเรียนนี้</div>`;
    } else {
      html += `<table class="curr-table"><thead><tr><th style="width:36px">#</th><th style="width:130px">รหัสวิชา</th><th>รายวิชา</th><th style="width:44px">ท</th><th style="width:44px">ป</th><th style="width:44px">น</th></tr></thead><tbody>`;
      rows.forEach((r,i)=>{
        html += `<tr><td class="num">${i+1}</td><td class="code">${esc(r.code)}</td><td>${esc(r.name)}</td><td class="num">${r.t}</td><td class="num">${r.p}</td><td class="num">${r.n}</td></tr>`;
      });
      html += `<tr class="curr-total"><td colspan="3">รวม</td><td class="num">${totT}</td><td class="num">${totP}</td><td class="num">${totN}</td></tr>`;
      html += `</tbody></table>`;
    }
  });
  return html;
}

async function openHistoryModal(){
  const hist=await getHistory();
  const rows=hist.slice().reverse().map((v,i)=>{
    const at=v._savedAt?new Date(v._savedAt).toLocaleString('th-TH'):'-';
    const label=v._label||'บันทึกข้อมูล';
    return `<div class="history-row"><div><b>${esc(label)}</b><div class="hist-time">${esc(at)}</div></div><button class="btn sm" data-restore-index="${hist.length-1-i}">เรียกคืน</button></div>`;
  }).join('') || '<div class="empty-note">ยังไม่มีประวัติการบันทึก</div>';
  openModalHtml(`<h3>ประวัติการบันทึก — ${STATE.term}/${STATE.year}</h3><div class="mb-row">เก็บได้สูงสุด 20 เวอร์ชัน การเรียกคืนจะสร้างข้อมูลปัจจุบันใหม่ ไม่ลบประวัติเดิม</div><div class="history-list">${rows}</div><div class="modal-actions"><button class="btn" data-modalclose>ปิด</button></div>`);
  document.querySelectorAll('[data-restore-index]').forEach(b=>b.onclick=async()=>{
    const i=Number(b.dataset.restoreIndex), h=await getHistory(), snap=h[i];
    if(!snap) return;
    await saveHistorySnapshot('ก่อนเรียกคืนเวอร์ชัน');
    delete snap._savedAt; delete snap._label;
    STATE.terms[termKey()]=JSON.parse(JSON.stringify(snap));
    ensureTermSubjects(); await saveTermData(); closeModal(); toast('เรียกคืนเวอร์ชันเรียบร้อย'); render();
  });
}
function compareOptions(type, selected){
  if(type==='class') return CLASSES.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.label)}</option>`).join('');
  if(type==='teacher') return STATE.teachers.map(t=>`<option value="${t.id}" ${t.id===selected?'selected':''}>${esc(t.short)}</option>`).join('');
  return ROOMS.map(r=>`<option value="${esc(r)}" ${r===selected?'selected':''}>ห้อง ${esc(r)}</option>`).join('');
}
function comparePlacements(type,id){
  if(type==='class') return placementsOf(id);
  if(type==='teacher') return placementsOfTeacher(id);
  return placementsOfRoom(id);
}
function renderCompareGrid(type,id){
  const plc=comparePlacements(type,id);
  let html=`<div class="ttable compare-table">${gridHeaderCells()}`;
  DAYS.forEach((d,di)=>{
    html+=`<div class="daycell">${d}</div>`;
    let occ={};
    if(di===HOMEROOM_DAY) occ[1]='fixed:Home-Room';
    plc.filter(p=>p.day===di).forEach(p=>{for(let k=0;k<p.hours;k++) occ[p.period+k]=p;});
    let skip=0;
    PERIODS.forEach(per=>{
      if(skip>0){skip--;return;}
      const o=occ[per];
      if(o && typeof o==='object' && o.period===per){
        const cl=classById(o.classId); const tch=teacherById(o.teacherId);
        html+=`<div class="block" style="grid-column:span ${o.hours};background:${cl?cl.color:'#888'}"><b>${esc(o.code)}</b><span class="bl-sub">${type==='class'?(tch?esc(tch.short):''):(cl?esc(cl.label):'')}</span><span class="bl-room">${o.room?'ห้อง '+esc(o.room):'ยังไม่กำหนดห้อง'}</span></div>`;
        skip=o.hours-1;
      } else if(typeof o==='string') html+=`<div class="cell fixed">Home-Room</div>`;
      else html+=`<div class="cell"></div>`;
    });
  });
  return html+'</div>';
}
function renderComparePanel(slot){
  const type=STATE.compare[slot+'Type'], id=STATE.compare[slot+'Id'];
  const title=type==='class'?'ตารางเรียน':type==='teacher'?'ตารางสอน':'ตารางห้อง';
  return `<div class="compare-panel"><div class="compare-head"><h3>${title}</h3><div class="compare-controls"><select data-compare-type="${slot}"><option value="class" ${type==='class'?'selected':''}>ตารางเรียน</option><option value="teacher" ${type==='teacher'?'selected':''}>ตารางสอน</option><option value="room" ${type==='room'?'selected':''}>ตารางห้อง</option></select><select data-compare-id="${slot}">${compareOptions(type,id)}</select></div></div><div class="compare-scroll">${renderCompareGrid(type,id)}</div></div>`;
}
async function onClearAllPlacements(){
  const t = curTerm();
  const count = Array.isArray(t.placements) ? t.placements.length : 0;
  if(count===0){
    toast('ขณะนี้ยังไม่มีข้อมูลการจัดตารางให้ล้าง');
    return;
  }
  const ok = confirm(
    `ต้องการล้างข้อมูลการจัดตารางทั้งหมด ${count} รายการหรือไม่?\n\n` +
    `การดำเนินการนี้จะลบตำแหน่งที่จัดไว้ใน\n` +
    `• ตารางเรียน\n• ตารางสอน\n• ตารางห้อง\n\n` +
    `แต่จะไม่ลบผู้สอน แผนการเรียน การล็อควันว่าง การล็อครายวิชา และการล็อคช่วงเวลาครู`
  );
  if(!ok) return;

  // เก็บเวอร์ชันก่อนล้าง เพื่อให้เรียกคืนได้จาก “ประวัติ”
  await saveHistorySnapshot(`ก่อนล้างข้อมูลการจัดตาราง ${count} รายการ`);
  t.placements = [];
  const saved = await saveTermData();
  await saveLastPointer();
  if(!saved){
    toast('ล้างข้อมูลแล้วแต่บันทึกไม่สำเร็จ กรุณากด บันทึก อีกครั้ง');
    render();
    return;
  }
  STATE.view='home';
  render();
  toast(`ล้างข้อมูลการจัดตาราง ${count} รายการเรียบร้อย`);
}

function renderCompare(){
  if(!STATE.compare) STATE.compare={leftType:'class',leftId:STATE.activeClass||CLASSES[0].id,rightType:'teacher',rightId:STATE.activeTeacher||STATE.teachers[0].id};
  return `<div class="section-head"><div><h2>เปรียบเทียบตารางแบบ 2 หน้าต่าง</h2><div class="sh-sub">ทั้งสองตารางใช้ข้อมูลจากตารางเรียนชุดเดียวกัน จึงตรวจสอบความสอดคล้องได้ทันที</div></div><button class="btn" data-nav="home">กลับหน้าหลัก</button></div><div class="compare-grid">${renderComparePanel('left')}${renderComparePanel('right')}</div>`;
}

function exportB64ToBytes(b64){
  const bin=atob(b64), out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function exportU16(a,o){return a[o]|(a[o+1]<<8);}
function exportU32(a,o){return (a[o]|(a[o+1]<<8)|(a[o+2]<<16)|(a[o+3]<<24))>>>0;}
async function exportInflateRaw(bytes){
  if(typeof DecompressionStream==='undefined') throw new Error('เบราว์เซอร์นี้ไม่รองรับการอ่านแม่แบบ Excel กรุณาใช้ Microsoft Edge/Chrome รุ่นปัจจุบัน');
  const ds=new DecompressionStream('deflate-raw');
  const ab=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(ab);
}
async function exportReadZipStoredOrDeflated(zipBytes){
  const dec=new TextDecoder('utf-8'), entries=[]; let o=0;
  while(o+4<=zipBytes.length){
    const sig=exportU32(zipBytes,o);
    if(sig!==0x04034b50) break;
    const flags=exportU16(zipBytes,o+6), method=exportU16(zipBytes,o+8);
    if(flags & 0x08) throw new Error('แม่แบบ Excel ใช้ data descriptor ซึ่งรุ่นนี้ไม่รองรับ');
    const csize=exportU32(zipBytes,o+18), nsize=exportU32(zipBytes,o+22);
    const nlen=exportU16(zipBytes,o+26), xlen=exportU16(zipBytes,o+28);
    const name=dec.decode(zipBytes.slice(o+30,o+30+nlen));
    const dataStart=o+30+nlen+xlen, comp=zipBytes.slice(dataStart,dataStart+csize);
    let data;
    if(method===0) data=comp.slice();
    else if(method===8) data=await exportInflateRaw(comp);
    else throw new Error('ไม่รองรับวิธีบีบอัด ZIP ของแม่แบบ: '+method);
    if(nsize && data.length!==nsize) throw new Error('ข้อมูลในแม่แบบ Excel ไม่ครบ: '+name);
    entries.push([name,data]);
    o=dataStart+csize;
  }
  if(!entries.length) throw new Error('อ่านแม่แบบ Excel ไม่สำเร็จ');
  return entries;
}

function exportStyleMap(sheetXml){
  const m={};
  const re=/<c\s+[^>]*?r="([A-Z]+[0-9]+)"[^>]*?(?:\s+s="([0-9]+)")?[^>]*>/g; let x;
  while((x=re.exec(sheetXml))) m[x[1]]=x[2]==null?'0':x[2];

  rows.push(`<row r="1" spans="1:12" ht="70"><c r="A1" t="inlineStr"><is><t>${exportXmlEsc(classById(classId)?.label||classId)}</t></is></c><c r="B1" t="inlineStr"><is><t>${exportXmlEsc(`ปีการศึกษา ${STATE.year} ภาคเรียนที่ ${STATE.term}`)}</t></is></c></row>`);
  const hdr=EXPORT_HEADERS.map((v,i)=>exportCellXml(cellRef(i+1,2),v,styles[cellRef(i+1,2)]|| (i===0?'2':'1'))).join('');
  rows.push(`<row r="2" spans="1:12" ht="70">${hdr}</row>`);
  for(let di=0;di<5;di++){
    const r=di+3, cells=[];
    cells.push(exportCellXml(`A${r}`,EXPORT_DAY_NAMES[di],styles[`A${r}`]||'5'));
    for(let per=1;per<=11;per++){
      const ref=cellRef(per+1,r), key=`${di}|${per}`, p=byStart.get(key);
      if(di===HOMEROOM_DAY && per===1){ cells.push(exportCellXml(ref,'Home-Room',styles[ref]||'5')); continue; }
      if(p){
        cells.push(exportCellXml(ref,exportCourseText(p),'6'));
      }else if(occupied.has(key)){
        cells.push(`<c r="${ref}"/>`);
      }else{
        cells.push(exportCellXml(ref,'',styles[ref]||'5'));
      }
    }
    rows.push(`<row r="${r}" spans="1:12" ht="70">${cells.join('')}</row>`);
  }
  let out=templateXml.replace(/<sheetData>[\s\S]*?<\/sheetData>/,`<sheetData>${rows.join('')}</sheetData>`);
  out=out.replace(/<mergeCells[\s\S]*?<\/mergeCells>/,'');
  const merges=[];
  placed.forEach(p=>{const h=Number(p.hours||1); if(h>1) merges.push(`<mergeCell ref="${cellRef(Number(p.period)+1,Number(p.day)+3)}:${cellRef(Number(p.period)+h,Number(p.day)+3)}"/>`);});
  if(merges.length){
    const mc=`<mergeCells count="${merges.length}">${merges.join('')}</mergeCells>`;
    out=out.replace(/<pageMargins/,mc+'<pageMargins');
  }
  return out;
}
function exportScheduleSummaryText(p, mode){

  if(mode==='teacher'){

function exportAllScheduleSheetXml(templateXml, mode){
  const styles=exportStyleMap(templateXml);
  const cellRef=(c,r)=>{ let n=Number(c), out=''; while(n>0){ const rem=(n-1)%26; out=String.fromCharCode(65+rem)+out; n=Math.floor((n-1)/26); } return out+r; };
  const targetItems = mode==='teacher' ? STATE.teachers.slice() : ROOMS.slice();
  const rows=[], merges=[]; let row=1;
  const allPlacements=curTerm().placements.slice();
  targetItems.forEach((item,idx)=>{
    const targetId=mode==='teacher' ? item.id : item;
    const title=mode==='teacher' ? (item.name||item.short||item.id) : `ห้อง ${item}`;
    rows.push(`<row r="${row}" spans="1:12" ht="70">${exportCellXml('A'+row,title,styles['A1']||'0')}</row>`);
    merges.push(`<mergeCell ref="A${row}:L${row}"/>`); row++;
    const hdr=EXPORT_HEADERS.map((v,i)=>exportCellXml(cellRef(i+1,row),v,styles[cellRef(i+1,2)]|| (i===0?'2':'1'))).join('');
    rows.push(`<row r="${row}" spans="1:12" ht="70">${hdr}</row>`); row++;
    const placed=allPlacements.filter(p=>mode==='teacher' ? p.teacherId===targetId : String(p.room)===String(targetId));
    for(let di=0;di<5;di++){
      const dataRow=row, cells=[];
      cells.push(exportCellXml(`A${dataRow}`,EXPORT_DAY_NAMES[di],styles[`A${di+3}`]||'5'));
      const byStart=new Map(), occupied=new Set();
      placed.filter(p=>p.day===di).forEach(p=>{ byStart.set(`${p.day}|${p.period}`,p); for(let k=0;k<Number(p.hours||1);k++) occupied.add(`${p.day}|${Number(p.period)+k}`); });
      for(let per=1;per<=11;per++){
        const ref=cellRef(per+1,dataRow), key=`${di}|${per}`, p=byStart.get(key);
        if(p){ cells.push(exportCellXml(ref,exportScheduleSummaryText(p,mode),'6')); const h=Number(p.hours||1); if(h>1) merges.push(`<mergeCell ref="${ref}:${cellRef(per+h,dataRow)}"/>`); }
        else if(occupied.has(key)) cells.push(`<c r="${ref}"/>`);
        else cells.push(exportCellXml(ref,'',styles[ref]||'5'));
      }
      rows.push(`<row r="${dataRow}" spans="1:12" ht="70">${cells.join('')}</row>`); row++;
    }
    if(idx<targetItems.length-1) row++;
  });
  const lastRow=Math.max(1,row-1);
  let out=templateXml.replace(/<dimension[^>]*\/>/,`<dimension ref="A1:L${lastRow}"/>`);
  out=out.replace(/<sheetData>[\s\S]*?<\/sheetData>/,`<sheetData>${rows.join('')}</sheetData>`);
  out=out.replace(/<mergeCells[\s\S]*?<\/mergeCells>/,'');
  out=out.replace(/<sheetFormatPr([^>]*)defaultRowHeight="[^"]*"([^>]*)\/>/,`<sheetFormatPr$1defaultRowHeight="70"$2/>`);
  if(merges.length){ const mc=`<mergeCells count="${merges.length}">${merges.join('')}</mergeCells>`; out=out.replace(/<pageMargins/,mc+'<pageMargins'); }
  return out;
}

/* สร้าง ZIP แบบ Store (ไม่บีบอัด) สำหรับประกอบไฟล์ .xlsx
   แก้ปัญหา zipStore is not defined โดยไม่ต้องพึ่งไลบรารีภายนอก */
function exportCrc32(bytes){
  let crc = 0xffffffff;
  for(let i=0;i<bytes.length;i++){
    crc ^= bytes[i];
    for(let k=0;k<8;k++) crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
  }
  return (crc ^ 0xffffffff) >>> 0;
}
function exportPutU16(a,o,v){ a[o]=v&255; a[o+1]=(v>>>8)&255; }
function exportPutU32(a,o,v){ v >>>= 0; a[o]=v&255; a[o+1]=(v>>>8)&255; a[o+2]=(v>>>16)&255; a[o+3]=(v>>>24)&255; }
function exportConcatBytes(parts){
  const total=parts.reduce((n,x)=>n+x.length,0), out=new Uint8Array(total);
  let o=0; for(const x of parts){out.set(x,o);o+=x.length;} return out;
}
function exportDosDateTime(){
  const d=new Date(), year=Math.max(1980,d.getFullYear());
  return {
    time:((d.getHours()<<11)|(d.getMinutes()<<5)|Math.floor(d.getSeconds()/2))&0xffff,
    date:(((year-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xffff
  };
}
function zipStore(entries){
  if(!Array.isArray(entries)||!entries.length) throw new Error('ไม่มีข้อมูลสำหรับสร้างไฟล์ Excel');
  const enc=new TextEncoder(), locals=[], centrals=[]; let offset=0; const dt=exportDosDateTime();
  for(const [rawName,rawData] of entries){
    const name=String(rawName||''), nameBytes=enc.encode(name);
    const data=rawData instanceof Uint8Array?rawData:new Uint8Array(rawData);
    if(nameBytes.length>0xffff) throw new Error('ชื่อไฟล์ใน ZIP ยาวเกินกำหนด: '+name);
    if(data.length>0xffffffff) throw new Error('ข้อมูลใน ZIP ใหญ่เกิน 4 GB: '+name);
    const crc=exportCrc32(data);
    const local=new Uint8Array(30+nameBytes.length+data.length);
    exportPutU32(local,0,0x04034b50); exportPutU16(local,4,20); exportPutU16(local,6,0x0800);
    exportPutU16(local,8,0); exportPutU16(local,10,dt.time); exportPutU16(local,12,dt.date);
    exportPutU32(local,14,crc); exportPutU32(local,18,data.length); exportPutU32(local,22,data.length);
    exportPutU16(local,26,nameBytes.length); exportPutU16(local,28,0); local.set(nameBytes,30); local.set(data,30+nameBytes.length);
    locals.push(local);
    const central=new Uint8Array(46+nameBytes.length);
    exportPutU32(central,0,0x02014b50); exportPutU16(central,4,20); exportPutU16(central,6,20); exportPutU16(central,8,0x0800);
    exportPutU16(central,10,0); exportPutU16(central,12,dt.time); exportPutU16(central,14,dt.date); exportPutU32(central,16,crc);
    exportPutU32(central,20,data.length); exportPutU32(central,24,data.length); exportPutU16(central,28,nameBytes.length); exportPutU16(central,30,0);
    exportPutU16(central,32,0); exportPutU16(central,34,0); exportPutU16(central,36,0); exportPutU32(central,38,0); exportPutU32(central,42,offset);
    central.set(nameBytes,46); centrals.push(central); offset+=local.length;
  }
  const centralSize=centrals.reduce((n,x)=>n+x.length,0), centralOffset=offset;
  if(centralOffset>0xffffffff||centralSize>0xffffffff||entries.length>0xffff) throw new Error('ไฟล์ Excel ใหญ่เกินขีดจำกัด ZIP แบบมาตรฐาน');
  const end=new Uint8Array(22); exportPutU32(end,0,0x06054b50); exportPutU16(end,4,0); exportPutU16(end,6,0);
  exportPutU16(end,8,entries.length); exportPutU16(end,10,entries.length); exportPutU32(end,12,centralSize); exportPutU32(end,16,centralOffset); exportPutU16(end,20,0);
  return exportConcatBytes([...locals,...centrals,end]);
}
function exportInlineCell(ref, value){
  return `<c r="${ref}" t="inlineStr"><is><t>${exportXmlEsc(String(value??''))}</t></is></c>`;
}
function exportSummarySheetXml(templateXml){
  const now = new Date();
  const dateText = now.toLocaleString('th-TH', {hour12:false});
  const placementCount = curTerm().placements.length;
  const roomCount = ROOMS.length;
  let xml = templateXml;
  xml = xml.replace(/<c r="B4"[^>]*>.*?<\/c>/, exportInlineCell('B4', dateText));
  xml = xml.replace(/<c r="B5"[^>]*>.*?<\/c>/, exportInlineCell('B5', roomCount));
  xml = xml.replace(/<c r="B6"[^>]*>.*?<\/c>/, exportInlineCell('B6', placementCount));
  xml = xml.replace(/<c r="B7"[^>]*>.*?<\/c>/, exportInlineCell('B7', 'ไฟล์นี้เป็นข้อมูลจากตารางปัจจุบันหลังการแก้ไข/ย้ายรายวิชา'));
  return xml;
}
async function exportExcelWorkbook(){
  try{
    const raw=exportB64ToBytes(EXPORT_TEMPLATE_XLSX_B64);
    const entries=await exportReadZipStoredOrDeflated(raw);
    const map=new Map(entries);
    // อัปเดตหน้าสรุปข้อมูลให้เป็นข้อมูลปัจจุบันทุกครั้งที่ส่งออก
    const summaryTemplate = new TextDecoder('utf-8').decode(map.get('xl/worksheets/sheet1.xml'));
    map.set('xl/worksheets/sheet1.xml', new TextEncoder().encode(exportSummarySheetXml(summaryTemplate)));
    // อัปเดต 7 ชีตตารางเรียนของนักเรียนจากข้อมูลปัจจุบัน
    EXPORT_ROOM_SHEETS.forEach(([classId,sheetName,sheetNo])=>{
      const path=`xl/worksheets/sheet${sheetNo}.xml`;
      const template=map.get(path);
      if(!template) throw new Error('ไม่พบชีต '+sheetName+' ในแม่แบบ');
      map.set(path,new TextEncoder().encode(exportRoomSheetXml(new TextDecoder('utf-8').decode(template),classId)));
    });
    // ชีต 10 = ตารางสอนรวมของครูทุกคน, ชีต 11 = ตารางการใช้ห้องเรียนทุกห้อง
    const scheduleTemplate=new TextDecoder('utf-8').decode(map.get('xl/worksheets/sheet2.xml'));
    map.set('xl/worksheets/sheet10.xml',new TextEncoder().encode(exportAllScheduleSheetXml(scheduleTemplate,'teacher')));
    map.set('xl/worksheets/sheet11.xml',new TextEncoder().encode(exportAllScheduleSheetXml(scheduleTemplate,'room')));
    const outEntries=entries.map(([name,data])=>[name,map.get(name)||data]);
    const zip=zipStore(outEntries);
    const blob=new Blob([zip],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    const safeYear=String(STATE.year||'').replace(/[^0-9]/g,'')||'year';
    const safeTerm=String(STATE.term||'').replace(/[^0-9]/g,'')||'term';
    a.href=url; a.download=`ตารางเรียน-ตารางสอน_${safeYear}_ภาค${safeTerm}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast(`ส่งออก Excel เรียบร้อย: ตารางเรียน ${EXPORT_ROOM_SHEETS.length} ห้อง + ตารางสอนครู ${STATE.teachers.length} คน + ตารางใช้ห้อง ${ROOMS.length} ห้อง`);
  }catch(err){
    console.error(err);
    alert('ไม่สามารถส่งออก Excel ได้: '+(err?.message||err));
  }
}

    el.ondragover = (ev)=>{ ev.preventDefault(); };
    el.ondrop = (ev)=>{ ev.preventDefault(); onDropRoomCell(el.dataset.droproom); };
  });
  // click placed block -> modal
  document.querySelectorAll('[data-editplacement]').forEach(el=>{
    el.onclick = ()=> openPlacementModal(el.dataset.editplacement);
  });
  if(STATE.view==='documents') bindDocumentActions();
}

/* =========================================================
   ACTIONS: place subject on class grid
========================================================= */
function getTeacherSubjectFromDrag(){
  if(!STATE.drag || STATE.drag.type!=='teacherSubject') return null;
  const [classId,idxStr]=STATE.drag.key.split('|');
  const idx=Number(idxStr);
  const s=subjectsOf(classId)[idx];
  return s ? {classId,idx,s} : null;
}
function getTeacherDropCheck(cellKey){
  const drag=getTeacherSubjectFromDrag();
  if(!drag) return {ok:false,reason:'ไม่มีรายวิชาที่กำลังลาก'};
  const [di,per]=cellKey.split('|').map(Number);
  const {classId,idx,s}=drag;
  if(s.teacherId!==STATE.activeTeacher) return {ok:false,reason:'รายวิชานี้ไม่ได้กำหนดให้ครูคนนี้'};
  const t=curTerm();
  if(t.placements.some(p=>p.classId===classId && Number(p.subIdx)===Number(idx))) return {ok:false,reason:'รายวิชานี้ถูกจัดลงตารางแล้ว'};
  const hours=Number(s.hours)||1;
  if(per+hours-1>PERIODS.length) return {ok:false,reason:'ช่องว่างไม่พอสำหรับจำนวนชั่วโมงของวิชานี้'};
  const vc=vocationalTimeCheck(classId,per,hours);
  if(!vc.ok) return vc;
  if(locksOf(classId).includes(di)) return {ok:false,reason:'วันนี้ของห้องเรียนถูกล็อกไว้'};
  if(di===HOMEROOM_DAY && per<=1 && per+hours-1>=1) return {ok:false,reason:'ช่วงเวลานี้มี Home-Room'};
  const classPlaced=t.placements.filter(p=>p.classId===classId && p.day===di);
  const teacherPlaced=t.placements.filter(p=>p.teacherId===STATE.activeTeacher && p.day===di);
  for(let k=0;k<hours;k++){
    const pp=per+k;
    if(classPlaced.some(x=>pp>=x.period && pp<x.period+x.hours)) return {ok:false,reason:'ห้องเรียนมีรายวิชาอื่นอยู่แล้ว'};
    const clash=teacherPlaced.some(x=>{
      if(!(pp>=x.period && pp<x.period+x.hours)) return false;
      const sameCombined=x.classId!==classId && String(x.code)===String(s.code) && String(x.name)===String(s.name);
      return !sameCombined;
    });
    if(clash) return {ok:false,reason:'ครูมีตารางสอนชนกันในช่วงเวลานี้'};
  }
  const candidate={teacherId:STATE.activeTeacher,classId,code:s.code,name:s.name,day:di,period:per,hours};
  if(teacherPlaced.some(x=>teacherContinuityConflict(x,candidate))) return {ok:false,reason:teacherContinuityReason()};
  return {ok:true,di,per,hours,classId,idx,s};
}
function onDropTeacherCell(cellKey){
  const check=getTeacherDropCheck(cellKey);
  if(!check.ok){ toast(check.reason); clearDropTargets(); STATE.drag=null; return; }
  const {classId,idx,s,di,per,hours}=check;
  STATE.drag=null; clearDropTargets();
  curTerm().placements.push({
    id:'plc_'+Date.now()+'_'+Math.floor(Math.random()*1000),
    classId,subIdx:idx,code:s.code,name:s.name,teacherId:s.teacherId,
    day:di,period:per,hours,room:''
  });
  saveTermData();
  toast('จัดรายวิชาลงตารางสอนเรียบร้อย');
  render();
}

function getSubjectFromDrag(){
  if(!STATE.drag) return null;

  // ลากรายวิชาที่ยังไม่ได้จัด
  if(STATE.drag.type==='subject'){
    const [classId, idxStr] = STATE.drag.key.split('|');
    const idx = Number(idxStr);
    const s = subjectsOf(classId)[idx];
    return s ? {classId, idx, s, placement:null} : null;
  }

  // ลากรายวิชาที่จัดไว้แล้ว เพื่อ "ย้ายตำแหน่ง" โดยไม่ต้องลบก่อน
  if(STATE.drag.type==='placement'){
    const p = curTerm().placements.find(x=>x.id===STATE.drag.id);
    if(!p) return null;
    const subs = subjectsOf(p.classId);
    let idx = Number(p.subIdx);
    let s = Number.isFinite(idx) ? subs[idx] : null;
    if(!s){
      idx = subs.findIndex(x=>String(x.code)===String(p.code));
      s = idx>=0 ? subs[idx] : null;
    }
    if(!s) s = {code:p.code,name:p.name,hours:p.hours,teacherId:p.teacherId};
    return {classId:p.classId, idx, s, placement:p};
  }

  return null;
}

// ตรวจสอบว่าจุดเริ่มต้นนี้สามารถวางวิชาได้หรือไม่
function getDropCheck(cellKey){
  const drag = getSubjectFromDrag();
  if(!drag) return {ok:false, reason:'ไม่พบรายวิชาที่กำลังลาก'};
  const [di, per] = cellKey.split('|').map(Number);
  const {classId, idx, s, placement} = drag;

  if(classId !== STATE.activeClass) return {ok:false, reason:'รายวิชานี้ไม่ตรงกับห้องที่กำลังจัดตาราง'};
  if(!s.teacherId) return {ok:false, reason:'กรุณาเลือกผู้สอนของรายวิชานี้ก่อน'};

  const t = curTerm();
  const ignoreIds = placement ? [placement.id] : [];

  // ถ้าเป็นการลากย้ายวิชาเดิม ให้ข้าม placement ต้นทาง
  if(!placement && t.placements.some(p=>p.classId===classId && Number(p.subIdx)===idx)){
    return {ok:false, reason:'รายวิชานี้ถูกจัดลงตารางแล้ว'};
  }

  const hours = Number(s.hours)||Number(placement?.hours)||1;
  if(per + hours - 1 > PERIODS.length) return {ok:false, reason:'ช่องว่างไม่พอสำหรับจำนวนชั่วโมงของวิชานี้'};

  const vc=vocationalTimeCheck(classId,per,hours);
  if(!vc.ok) return vc;

  const locks = locksOf(classId);
  if(locks.includes(di)) return {ok:false, reason:'วันนี้ถูกล็อกไว้'};

  if(di===HOMEROOM_DAY && per<=1 && per+hours-1>=1){
    return {ok:false, reason:'ช่วงเวลานี้มี Home-Room'};
  }

  // ห้องเรียนของชั้นนี้ต้องว่างทุกคาบของวิชา โดยไม่นับวิชาที่กำลังย้าย
  const classPlaced = t.placements.filter(p=>p.classId===classId && p.day===di && !ignoreIds.includes(p.id));

  // ครูต้องว่างทุกคาบ โดยไม่นับวิชาที่กำลังย้าย
  const teacherPlaced = t.placements.filter(p=>p.teacherId===s.teacherId && p.day===di && !ignoreIds.includes(p.id));

  for(let k=0;k<hours;k++){
    const pp=per+k;

    if(classPlaced.some(x=>pp>=x.period && pp<x.period+x.hours)){
      return {ok:false, reason:'ช่วงเวลานี้มีรายวิชาอื่นอยู่แล้ว'};
    }

    const teacherClash = teacherPlaced.some(x=>{
      if(!(pp>=x.period && pp<x.period+x.hours)) return false;
      const sameCombined =
        x.classId!==classId &&
        x.teacherId===s.teacherId &&
        String(x.code)===String(s.code) &&
        String(x.name)===String(s.name);
      return !sameCombined;
    });

    if(teacherClash){
      return {ok:false, reason:'ผู้สอนมีตารางสอนในช่วงเวลานี้แล้ว (ยกเว้นวิชาเดียวกัน รหัสเดียวกัน ครูคนเดียวกัน ซึ่งถือเป็นการเรียนรวม)'};
    }
  }

  const candidate={teacherId:s.teacherId,classId,code:s.code,name:s.name,day:di,period:per,hours};

  if(teacherPlaced.some(x=>teacherContinuityConflict(x,candidate))){
    return {ok:false, reason:teacherContinuityReason()};
  }

  return {ok:true,di,per,hours,classId,idx,s,placement};
}

function paintTeacherDropTargets(){

  document.querySelectorAll('[data-dropteachercell]').forEach(el=>{
    const check=getTeacherDropCheck(el.dataset.dropteachercell);
    el.classList.toggle('drop-ok',!!check.ok);
    el.classList.toggle('drop-bad',!!STATE.drag && STATE.drag.type==='teacherSubject' && !check.ok);
  });
}
function clearTeacherDropTargets(){
  document.querySelectorAll('[data-dropteachercell]').forEach(el=>el.classList.remove('drop-ok','drop-bad'));
}

function paintDropTargets(){
  document.querySelectorAll('[data-dropcell]').forEach(el=>{
    const check=getDropCheck(el.dataset.dropcell);
    el.classList.toggle('drop-ok',!!check.ok);
    el.classList.toggle('drop-bad',!!STATE.drag && STATE.drag.type==='subject' && !check.ok);
  });
}

function clearDropTargets(){
  document.querySelectorAll('[data-dropcell]').forEach(el=>el.classList.remove('drop-ok','drop-bad'));
}

function onDropClassCell(cellKey){
  const check=getDropCheck(cellKey);
  if(!check.ok){
    toast(check.reason);
    clearDropTargets();
    STATE.drag=null;
    return;
  }

  const {classId, idx, s, di, per, hours, placement}=check;
  STATE.drag=null;
  clearDropTargets();

  const t=curTerm();

  if(placement){
    // ย้าย placement เดิม: รักษา id และห้องเดิมไว้
    placement.day=di;
    placement.period=per;
    placement.hours=hours;
    placement.subIdx=idx;
    placement.code=s.code;
    placement.name=s.name;
    placement.teacherId=s.teacherId;
    saveTermData();
    toast('ย้ายรายวิชาไปยังตำแหน่งใหม่เรียบร้อย');
  }else{
    t.placements.push({
      id:'plc_'+Date.now()+'_'+Math.floor(Math.random()*1000),
      classId, subIdx:idx, code:s.code, name:s.name,
      teacherId:s.teacherId, day:di, period:per, hours, room:(s.room||'')
    });
    saveTermData();
    toast('จัดตารางเรียนเรียบร้อย — กำหนดห้องภายหลังได้');
  }

  render();
}

/* =========================================================
   ACTIONS: assign room
========================================================= */
function onDropRoomCell(cellKey){
  if(!STATE.drag || STATE.drag.type!=='roomitem'){ return; }
  const [di, per] = cellKey.split('|').map(Number);
  const t = curTerm();
  const p = t.placements.find(x=>x.id===STATE.drag.id);
  STATE.drag=null;
  if(!p){ return; }
  if(p.day!==di || p.period!==per){
    toast('ต้องวางในวัน/คาบเดียวกับที่จัดตารางเรียนไว้แล้ว: '+DAYS[p.day]+' คาบ '+p.period);
    return;
  }
  p.room = STATE.activeRoom;
  saveTermData();
  toast('กำหนดห้อง '+STATE.activeRoom+' ให้ '+p.code+' เรียบร้อย');
  render();
}

/* =========================================================
   MODAL
========================================================= */
function openModalHtml(inner){
  const bg = document.createElement('div');
  bg.className='modal-bg'; bg.id='modalBg';
  bg.innerHTML = `<div class="modal-box">${inner}</div>`;
  bg.onclick = (ev)=>{ if(ev.target===bg) closeModal(); };
  document.body.appendChild(bg);
  bg.querySelectorAll('[data-modalclose]').forEach(b=>b.onclick=closeModal);
}
function closeModal(){ const bg=document.getElementById('modalBg'); if(bg) bg.remove(); }

function openPlacementModal(placementId){
  const t = curTerm();
  const p = t.placements.find(x=>x.id===placementId);
  if(!p) return;
  const cl = classById(p.classId);
  const tch = p.teacherId? teacherById(p.teacherId): null;
  const roomOptions = ROOMS.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('');
  openModalHtml(`
    <h3>${esc(p.code)}</h3>
    <div class="mb-row"><b>รายวิชา:</b> ${esc(p.name)}</div>
    <div class="mb-row"><b>ห้องเรียน:</b> ${esc(cl.label)}</div>
    <div class="mb-row"><b>ผู้สอน:</b> ${tch?esc(tch.name):'-'}</div>
    <div class="mb-row"><b>วัน/เวลา:</b> ${DAYS[p.day]} คาบ ${p.period}${p.hours>1?'-'+(p.period+p.hours-1):''} (${periodTime(p.period)})</div>
    <div class="field" style="margin-top:12px"><label><b>ห้องที่ใช้สอน</b></label>
      <select id="placementRoomSelect" style="width:100%;padding:9px 11px;border-radius:8px;border:1.5px solid var(--line2);background:#fff">${roomOptions}</select>
      <div style="font-size:11.5px;color:var(--sub);margin-top:5px">เปลี่ยนเลขห้องได้จากตรงนี้ ตารางห้องและหน้าต่างเปรียบเทียบจะอัปเดตตามทันที</div>
    </div>
    <div class="modal-actions">
      <button class="btn" data-modalclose>ยกเลิก</button>
      <button class="btn primary" id="savePlacementRoom">บันทึกห้อง</button>
      <button class="btn danger" id="delPlacement">ลบออกจากตาราง</button>
    </div>
  `);
  document.getElementById('savePlacementRoom').onclick = async ()=>{
    const room = document.getElementById('placementRoomSelect').value;
    const overlap = t.placements.some(x=>{
      if(x.id===p.id || !room || x.room!==room || x.day!==p.day) return false;
      const timeOverlap = p.period < x.period + x.hours && x.period < p.period + p.hours;
      if(!timeOverlap) return false;
      const sameCombined = x.teacherId===p.teacherId && String(x.code)===String(p.code) && String(x.name)===String(p.name);
      return !sameCombined;
    });
    if(overlap){
      toast('ห้อง '+room+' มีการใช้งานชนกับรายวิชาอื่นในช่วงเวลานี้');
      return;
    }
    p.room = room;
    if(room && !ROOMS.includes(room)){
      ROOMS.push(room);
      STATE.rooms = [...ROOMS];
      await saveRooms();
    }
    const ok = await saveTermData();
    if(!ok){ toast('บันทึกห้องไม่สำเร็จ กรุณาลองอีกครั้ง'); return; }
    closeModal();
    toast(room ? 'เปลี่ยนห้อง '+room+' เรียบร้อย' : 'ยกเลิกการกำหนดห้องเรียบร้อย');
    render();
  };
  document.getElementById('delPlacement').onclick = async ()=>{
    const idx = t.placements.findIndex(x=>x.id===placementId);
    if(idx>=0) t.placements.splice(idx,1);
    const ok = await saveTermData();
    closeModal();
    toast(ok
      ? 'ลบรายวิชาออกจากตารางแล้ว สามารถลากรายวิชากลับมาวางใหม่ได้ทันที'
      : 'ลบรายวิชาแล้ว แต่บันทึกไม่สำเร็จ กรุณาลองอีกครั้ง');
    render();
  };
}
